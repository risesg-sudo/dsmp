<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Comprehensive revision notes for the CampusX Data Science Mentorship Program 2.0">
    <meta name="theme-color" content="#6c5ce7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>DSMP 2.0 Revision Notes Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect fill='%236c5ce7' width='192' height='192'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-size='120' fill='white'%3E📚%3C/text%3E%3C/svg%3E">
</head>
<body>
    <!-- Progress Bar at top -->
    <div class="scroll-progress-container">
        <div class="scroll-progress-bar" id="scrollProgressBar"></div>
        <div class="scroll-percentage" id="scrollPercentage">0%</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>DSMP 2.0 Revision</h2>
                <button class="stats-toggle" id="statsToggle">📊 Stats</button>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search notes...">
            </div>

            <nav class="nav-tree" id="navTree">
                <!-- Navigation will be dynamically loaded -->
            </nav>

            <!-- Reading Progress Summary -->
            <div class="progress-summary" id="progressSummary">
                <h3>Reading Progress</h3>
                <div class="progress-stats">
                    <div class="stat-item">
                        <span class="stat-label">Documents Read:</span>
                        <span class="stat-value" id="docsRead">0/0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Total Time:</span>
                        <span class="stat-value" id="totalTime">0m</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Current Streak:</span>
                        <span class="stat-value" id="currentStreak">0 days</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="content-header">
                <button class="sidebar-toggle" id="sidebarToggle">☰</button>
                <div class="breadcrumb" id="breadcrumb"></div>
                <div class="reading-time" id="readingTime">
                    <span class="timer">⏱️ <span id="sessionTimer">0:00</span></span>
                </div>
            </div>

            <article class="markdown-content" id="markdownContent">
                <div class="welcome-screen">
                    <h1>Welcome to DSMP 2.0 Revision Notes</h1>
                    <p>Select a topic from the sidebar to begin reading.</p>
                    <p>Your scroll progress will be automatically tracked and saved.</p>
                </div>
            </article>

            <!-- Scroll Position Indicator -->
            <div class="scroll-indicator" id="scrollIndicator">
                <div class="scroll-dot"></div>
            </div>
        </main>
    </div>

    <!-- Analytics Dashboard Modal -->
    <div class="modal" id="statsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📊 Reading Analytics</h2>
                <button class="modal-close" id="modalClose">×</button>
            </div>
            <div class="modal-body" id="statsModalBody">
                <!-- Stats will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">

    <!-- Application Scripts -->
    <script src="scroll-tracker.js"></script>
    <script src="storage-manager.js"></script>
    <script src="analytics.js"></script>
    <!-- Phase 2 Features -->
    <script src="notes-manager.js"></script>
    <script src="bookmarks-manager.js"></script>
    <script src="goals-manager.js"></script>
    <!-- Phase 3 Features -->
    <script src="flashcards-manager.js"></script>
    <script src="code-runner.js"></script>
    <script src="quiz-manager.js"></script>
    <!-- Main App (must load last) -->
    <script src="app.js"></script>

    <!-- Service Worker Registration (PWA) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('✅ Service Worker registered:', registration.scope);

                        // Check for updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New service worker available
                                    if (confirm('New version available! Reload to update?')) {
                                        newWorker.postMessage({ action: 'skipWaiting' });
                                        window.location.reload();
                                    }
                                }
                            });
                        });
                    })
                    .catch(error => {
                        console.log('❌ Service Worker registration failed:', error);
                    });

                // Handle service worker updates
                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!refreshing) {
                        refreshing = true;
                        window.location.reload();
                    }
                });
            });
        }

        // PWA Install Prompt
        let deferredPrompt;
        const installPrompt = document.createElement('div');
        installPrompt.className = 'pwa-install-prompt';
        installPrompt.innerHTML = `
            <div class="pwa-prompt-header">
                <div class="pwa-icon">📱</div>
                <div class="pwa-prompt-content">
                    <h4>Install DSMP Notes</h4>
                    <p>Access your study materials offline</p>
                </div>
            </div>
            <div class="pwa-prompt-actions">
                <button class="btn btn-primary" id="installPWA">Install</button>
                <button class="btn btn-secondary" id="dismissPWA">Later</button>
            </div>
        `;
        document.body.appendChild(installPrompt);

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;

            // Show install prompt after 30 seconds if not dismissed
            setTimeout(() => {
                const dismissed = localStorage.getItem('pwa-install-dismissed');
                if (!dismissed) {
                    installPrompt.classList.add('show');
                }
            }, 30000);
        });

        // Install button click
        document.addEventListener('click', (e) => {
            if (e.target.id === 'installPWA') {
                installPrompt.classList.remove('show');
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === 'accepted') {
                            console.log('✅ PWA installed');
                        }
                        deferredPrompt = null;
                    });
                }
            }

            if (e.target.id === 'dismissPWA') {
                installPrompt.classList.remove('show');
                localStorage.setItem('pwa-install-dismissed', 'true');
            }
        });

        // Detect if app was installed
        window.addEventListener('appinstalled', () => {
            console.log('✅ DSMP Notes PWA was installed');
            installPrompt.remove();
        });

        // Handle offline/online status
        window.addEventListener('online', () => {
            console.log('🌐 Back online');
        });

        window.addEventListener('offline', () => {
            console.log('📡 You are offline - cached content will be available');
        });
    </script>
</body>
</html>
